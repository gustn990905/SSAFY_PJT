<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냠냠코치 - 식단 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
        <div class="container">
            <a class="navbar-brand" href="main.html">YumYumCoach</a>
            <ul class="navbar-nav ms-auto" id="navMenu">
                <li class="nav-item"><a class="nav-link" href="main.html">홈</a></li>
                <li class="nav-item"><a class="nav-link active" href="diet.html">식단관리</a></li>
                <li class="nav-item"><a class="nav-link" href="community.html">커뮤니티</a></li>
                <li class="nav-item"><a class="nav-link" href="challenge.html">챌린지</a></li>
                <li class="nav-item"><a class="nav-link" href="ai.html">AI 코칭</a></li>
                <li class="nav-item"><a class="nav-link" href="profile.html">회원 수정</a></li>
                <li class="nav-item"><a class="nav-link" href="user-list.html">사용자 목록</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">로그아웃</a></li>
            </ul>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h2 class="mb-0">🍱 신규 식단 등록</h2>
            <a href="diet.html" class="btn btn-outline-secondary">목록으로 돌아가기</a>
        </div>

        <div class="card mb-5">
            <div class="card-header bg-white">신규 식단 등록</div>
            <div class="card-body">
                <form id="mealForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">사용자 ID</label>
                            <input type="text" class="form-control" id="userId" placeholder="예: user01" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">날짜</label>
                            <input type="date" class="form-control" id="mealDate" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">식사 구분</label>
                            <select class="form-select" id="mealType">
                                <option value="아침">아침</option>
                                <option value="점심">점심</option>
                                <option value="저녁">저녁</option>
                                <option value="간식">간식</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">음식 검색</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="foodSearch" placeholder="예: 수박화채">
                                <button class="btn btn-outline-secondary" type="button" id="btnSearch">검색</button>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <h6>검색 결과</h6>
                        <ul class="list-group mb-3" id="searchResultList">
                            <li class="list-group-item text-muted">검색어를 입력하고 검색 버튼을 누르세요.</li>
                        </ul>
                    </div>

                    <div class="mt-4">
                        <h6>선택된 음식 목록</h6>
                        <ul class="list-group mb-3" id="selectedFoodList">
                            <li class="list-group-item text-muted">검색 버튼을 눌러 음식을 추가하세요.</li>
                        </ul>
                    </div>

                    <div class="alert alert-info" id="nutritionAnalysis">
                        <strong>영양 분석 요약:</strong> 아직 등록된 음식이 없습니다.
                    </div>

                    <div class="d-flex justify-content-end gap-2 flex-wrap">
                        <a href="diet.html" class="btn btn-outline-secondary">취소</a>
                        <button type="submit" class="btn btn-primary px-4">식단 저장하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
