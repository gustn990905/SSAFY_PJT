<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YumYumCoach - 식단 조회</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    body { font-family: "Noto Sans KR", sans-serif; background:#f6f8fb; }
    .app-navbar { background:#fff; border-bottom:1px solid #e9ecef; }
    .app-navbar .nav-link { color:#333; }
    .app-navbar .nav-link.active { font-weight:700; }
    .page-wrap { max-width: 1200px; margin: 0 auto; }
  </style>
</head>

<body>
  <!-- ✅ 공통 상단 메뉴(사진1 스타일) -->
  <nav class="navbar navbar-expand-lg app-navbar">
    <div class="container-fluid page-wrap">
      <a class="navbar-brand fw-bold" href="main.html">YumYumCoach</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="topNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html">홈</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">식단관리</a></li>
          <li class="nav-item"><a class="nav-link" href="community.html">커뮤니티</a></li>

          <!-- 아래 3개는 네 프로젝트에 실제 페이지가 있으면 파일명 맞춰서 수정 -->
          <li class="nav-item"><a class="nav-link" href="ai.html">AI 코칭</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">프로필</a></li>

          <li class="nav-item">
            <button class="btn btn-outline-secondary btn-sm" id="logoutBtn" type="button">로그아웃</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5 page-wrap">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h2 class="mb-0">🥗 나의 식단 관리</h2>
      <a href="register.html" class="btn btn-primary">식단 등록</a>
    </div>

    <!-- 조회 -->
    <div class="card mb-4">
      <div class="card-header bg-white">식단 조회</div>
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label">식단 ID 조회</label>
            <input type="number" class="form-control" id="searchMealId" placeholder="식단 ID 입력" />
          </div>

          <div class="col-md-4">
            <label class="form-label">사용자 ID 조회</label>
            <input type="text" class="form-control" id="searchUserId" placeholder="사용자 ID 입력" />
          </div>

          <div class="col-md-4 d-flex gap-2">
            <button class="btn btn-success w-100" type="button" id="btnSearchByMealId">식단 ID 조회</button>
            <button class="btn btn-outline-primary w-100" type="button" id="btnSearchByUserId">사용자 ID 조회</button>
          </div>
        </div>

        <div class="mt-3">
          <button class="btn btn-outline-secondary btn-sm" type="button" id="btnFetchAll">전체 조회</button>
        </div>
      </div>
    </div>

    <!-- 목록 -->
    <div class="card">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <span>내 식단 기록 목록</span>
        <span class="text-muted small" id="listCountText">총 0건</span>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>식단 ID</th>
                <th>사용자 ID</th>
                <th>날짜</th>
                <th>구분</th>
                <th>대표 음식</th>
                <th>총 칼로리</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="mealTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 상세 모달(기존 유지) -->
  <div class="modal fade" id="mealDetailModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">식단 상세 정보</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editMealForm">
            <input type="hidden" id="editMealId" />
            <div class="mb-3">
              <label class="form-label">사용자 ID</label>
              <input type="text" class="form-control" id="editUserId" />
            </div>
            <div class="mb-3">
              <label class="form-label">날짜</label>
              <input type="date" class="form-control" id="editDate" />
            </div>
            <div class="mb-3">
              <label class="form-label">식사 구분</label>
              <select class="form-select" id="editType">
                <option value="아침">아침</option>
                <option value="점심">점심</option>
                <option value="저녁">저녁</option>
                <option value="간식">간식</option>
              </select>
            </div>
            <div id="editFoodListArea"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger me-auto" id="btnDeleteMeal">삭제하기</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
          <button type="button" class="btn btn-success" id="btnUpdateMeal">수정 완료</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ 로그아웃 처리(다른 페이지와 흐름 통일) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("logoutBtn");
      if (!btn) return;

      btn.addEventListener("click", () => {
        localStorage.removeItem("currentUser");
        // 로그인 페이지 파일명이 다르면 여기만 바꿔줘
        window.location.href = "login.html";
      });
    });
  </script>

  <script src="js/index.js"></script>
</body>
</html>
