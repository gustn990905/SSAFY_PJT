<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>게시글 작성/수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- ✅ challenge.html과 동일한 네비 -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
    <div class="container">
      <a class="navbar-brand" href="main.html">YumYumCoach</a>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="main.html">홈</a></li>
        <li class="nav-item"><a class="nav-link" href="diet.html">식단관리</a></li>
        <li class="nav-item"><a class="nav-link active" href="community.html">커뮤니티</a></li>
        <li class="nav-item"><a class="nav-link" href="challenge.html">챌린지</a></li>
        <li class="nav-item"><a class="nav-link" href="ai.html">AI 코칭</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">프로필</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">로그아웃</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h2 class="mb-0" id="formTitle">게시글 등록</h2>
      <a href="community.html" class="btn btn-outline-secondary">목록으로</a>
    </div>

    <div class="card">
      <div class="card-header bg-white">게시글 정보 입력</div>
      <div class="card-body">
        <form id="postForm">
          <input type="hidden" id="postId">

          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">작성자</label>
              <input type="text" class="form-control" id="author" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">카테고리</label>
              <select class="form-select" id="category" required>
                <option value="질문">질문</option>
                <option value="정보">정보</option>
                <option value="식단">식단</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">제목</label>
              <input type="text" class="form-control" id="title" required>
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label">내용</label>
            <textarea class="form-control" id="content" rows="10" required></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="community.html" class="btn btn-outline-secondary">취소</a>
            <button type="submit" class="btn btn-primary" id="submitBtn">등록하기</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ✅ storage.js 포함 (중요) -->
  <script src="js/storage.js"></script>
  <script src="js/community-form.js"></script>
</body>
</html>
