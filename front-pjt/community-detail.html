<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>게시글 상세</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- ✅ challenge.html과 동일한 네비 톤/구조 -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
    <div class="container">
      <a class="navbar-brand" href="main.html">YumYumCoach</a>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="main.html">홈</a></li>
        <li class="nav-item"><a class="nav-link" href="diet.html">식단관리</a></li>
        <li class="nav-item"><a class="nav-link active" href="community.html">커뮤니티</a></li>
        <li class="nav-item"><a class="nav-link" href="challenge.html">챌린지</a></li>
        <li class="nav-item"><a class="nav-link" href="ai.html">AI 코칭</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">프로필</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">로그아웃</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h2 class="mb-0">게시글 상세</h2>
      <a href="community.html" class="btn btn-outline-secondary">목록으로</a>
    </div>

    <!-- 게시글 -->
    <div class="card mb-4">
      <div class="card-header bg-white">게시글 내용</div>
      <div class="card-body">
        <div class="mb-2 text-muted small" id="postMeta"></div>
        <h3 class="mb-3" id="postTitle"></h3>
        <p class="post-content mb-0" id="postContent" style="white-space:pre-line;"></p>

        <div class="d-flex gap-2 mt-4 flex-wrap">
          <button class="btn btn-outline-warning" id="likePostBtn" type="button">좋아요</button>
          <a class="btn btn-outline-primary" id="editPostBtn">글 수정</a>
          <button class="btn btn-outline-danger" id="deletePostBtn" type="button">글 삭제</button>
        </div>
      </div>
    </div>

    <!-- 댓글 작성 -->
    <div class="card mb-4">
      <div class="card-header bg-white">댓글 작성</div>
      <div class="card-body">
        <form id="commentForm">
          <input type="hidden" id="editingCommentId">

          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">작성자</label>
              <input type="text" class="form-control" id="commentAuthor" required>
            </div>
            <div class="col-md-8">
              <label class="form-label">댓글 내용</label>
              <input type="text" class="form-control" id="commentContent" required>
            </div>
          </div>

          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-primary" type="submit" id="commentSubmitBtn">댓글 등록</button>
            <button class="btn btn-outline-secondary" type="button" id="cancelEditCommentBtn">수정 취소</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 댓글 목록 -->
    <div class="card">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <span>댓글 목록</span>
        <span class="text-muted small" id="commentCountText">총 0건</span>
      </div>
      <div class="card-body" id="commentList"></div>
    </div>
  </div>

  <!-- ✅ storage.js 사용 (challenge와 동일) -->
  <script src="js/storage.js"></script>
  <script src="js/community-detail.js"></script>
</body>
</html>
