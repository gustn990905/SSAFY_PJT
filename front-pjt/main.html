<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YumYumCoach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
        <div class="container">
            <a class="navbar-brand" href="main.html">YumYumCoach</a>
            <ul class="navbar-nav ms-auto" id="navMenu">
                <li class="nav-item"><a class="nav-link active" href="login.html">로그인</a></li>
                <li class="nav-item"><a class="nav-link" href="signup.html">회원가입</a></li>
            </ul>
        </div>
    </nav>

    <div class="hero text-center py-5 bg-light" id="heroSection">
        <h1>AI 기반 건강 코칭 서비스</h1>
        <p class="lead">식단 분석 · 운동 추천 · 커뮤니티</p>
    </div>

    <div class="container mt-5">
        <h3 class="mb-4">추천 탭</h3>
        <div class="row">
            <div class="col-md-4 card-food mb-4">
                <div class="card shadow-sm">
                    <img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=600" 
class="card-img-top" alt="식단 기록">                    <div class="card-body">
                        <h5 class="card-title">식단 기록</h5>
                        <p class="card-text">오늘의 식단 작성</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 card-food mb-4">
                <div class="card shadow-sm">
                    <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600" 
class="card-img-top" alt="건강 리포트">
                    <div class="card-body">
                        <h5 class="card-title">건강 리포트</h5>
                        <p class="card-text">영양 점수 분석</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 card-food mb-4">
                <div class="card shadow-sm">
                    <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=600" 
class="card-img-top" alt="균형">
                    <div class="card-body">
                        <h5 class="card-title">챌린지</h5>
                        <p class="card-text">건강 습관 챌린지</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5 mb-5">
        <h3 class="mb-3">커뮤니티 인기글</h3>
        <ul id="popularPost" class="list-group shadow-sm">
            <li class="list-group-item text-muted text-center">불러올 게시글이 없습니다.</li>
        </ul>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="successToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">알림</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/follow.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
