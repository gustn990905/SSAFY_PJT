<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>로그인</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
<div class="container">
<a class="navbar-brand">YumYumCoach</a>
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="signup.html">회원가입</a></li>
</ul>
</div>
</nav>
<div class="container mt-5">
<h2>로그인</h2>
<input id="id" placeholder="아이디" class="form-control mb-2">
<input id="pw" placeholder="비밀번호" type="password" class="form-control mb-2">
<button onclick="login()" class="btn btn-primary">로그인</button>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3">
<div id="successToast" class="toast" role="alert">
<div class="toast-header">
<strong class="me-auto">알림</strong>
<button type="button" class="btn-close" data-bs-dismiss="toast"></button>
</div>
<div class="toast-body"></div>
</div>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
