<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>커뮤니티</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
    <div class="container">
      <a class="navbar-brand" href="main.html">YumYumCoach</a>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="main.html">홈</a></li>
        <li class="nav-item"><a class="nav-link" href="diet.html">식단관리</a></li>
        <li class="nav-item"><a class="nav-link active" href="community.html">커뮤니티</a></li>
        <li class="nav-item"><a class="nav-link" href="challenge.html">챌린지</a></li>
        <li class="nav-item"><a class="nav-link" href="ai.html">AI 코칭</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">프로필</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">로그아웃</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h2 class="mb-0">커뮤니티</h2>
      <!-- ✅ 원래 파일명 그대로 유지 -->
      <a href="community-form.html?mode=create" class="btn btn-success">글 등록</a>
    </div>

    <div class="card mb-4">
      <div class="card-header bg-white">게시글 조회</div>
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label">게시글 ID 조회</label>
            <input type="number" class="form-control" id="searchPostId" placeholder="게시글 ID 입력">
          </div>
          <div class="col-md-4">
            <label class="form-label">작성자 ID 조회</label>
            <input type="text" class="form-control" id="searchAuthor" placeholder="작성자 입력">
          </div>
          <div class="col-md-4">
            <label class="form-label">카테고리 조회</label>
            <select class="form-select" id="searchCategory">
              <option value="">전체</option>
              <option value="질문">질문</option>
              <option value="정보">정보</option>
              <option value="식단">식단</option>
            </select>
          </div>
        </div>

        <div class="mt-3 d-flex gap-2 flex-wrap">
          <button class="btn btn-success" type="button" id="btnSearchPostId">글 ID 조회</button>
          <button class="btn btn-outline-success" type="button" id="btnSearchAuthor">작성자 조회</button>
          <button class="btn btn-outline-success" type="button" id="btnSearchCategory">카테고리 조회</button>
          <button class="btn btn-outline-secondary" type="button" id="btnFetchAllPosts">전체 조회</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <span>게시글 목록</span>
        <span class="text-muted small" id="postCountText">총 0건</span>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th style="width:90px;">글 ID</th>
                <th style="width:90px;">카테고리</th>
                <th>제목</th>
                <th style="width:120px;">작성자</th>
                <th style="width:80px;">좋아요</th>
                <th style="width:80px;">댓글 수</th>
                <th style="width:120px;">작성일</th>
                <th style="width:240px;">관리</th>
              </tr>
            </thead>
            <tbody id="postTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/community.js"></script>
  <script>
    window.onload = loadCommunity;
  </script>
</body>
</html>
